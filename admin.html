<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gallery Admin</title>
<style>
  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c26;
    --border: rgba(255,255,255,0.07);
    --text: #f0ede8; --text2: #9a9490; --text3: #5a5650;
    --gold: #d4a847; --gold-light: #f0c96a;
    --rose: #c4737a; --teal: #5a9e9a; --green: #5aa86e; --red: #c45a5a;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:120px;
  }
  .header {
    position:sticky; top:0; z-index:50;
    padding:calc(var(--safe-top) + 14px) 16px 14px;
    background:rgba(10,10,15,0.9); backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand {
    font-size:19px; font-weight:700; letter-spacing:-0.4px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .header a { font-size:13px; color:var(--teal); text-decoration:none; }

  .section { padding:18px 16px 8px; }
  .section-title {
    font-size:11px; letter-spacing:1.5px; color:var(--text3);
    text-transform:uppercase; margin-bottom:12px;
  }

  /* Add card */
  .add-box {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; margin-bottom:8px;
  }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; color:var(--text2); margin-bottom:5px; }
  .field input, .field select {
    width:100%; padding:10px 12px; background:var(--surface2);
    border:1px solid var(--border); border-radius:10px; color:var(--text);
    font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus { border-color:var(--gold); }

  .file-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px; border:1.5px dashed var(--border); border-radius:10px;
    background:var(--surface2); color:var(--text2); font-size:14px;
    cursor:pointer; transition:border-color .2s, color .2s;
  }
  .file-btn:active { border-color:var(--gold); color:var(--gold-light); }
  .file-info { font-size:12px; color:var(--teal); margin-top:8px; }

  .btn {
    width:100%; padding:13px; border:none; border-radius:10px;
    font-size:15px; font-weight:600; cursor:pointer; margin-top:6px;
    transition:transform .12s, opacity .2s;
  }
  .btn:active { transform:scale(0.98); }
  .btn-primary { background:var(--gold); color:#0a0a0f; }
  .btn-primary:disabled { opacity:0.4; }
  .btn-export {
    background:linear-gradient(135deg,var(--green),#3f8a55); color:#fff;
  }

  /* Catalogue list */
  .cat-row {
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px; margin-bottom:8px;
  }
  .cat-row-main { flex:1; min-width:0; }
  .cat-row-name {
    font-size:14px; font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .cat-row-meta { font-size:12px; color:var(--text3); margin-top:2px; }
  .cat-row-cat {
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text2); border-radius:8px; padding:5px 8px;
    font-size:12px; outline:none; max-width:120px;
  }
  .del-btn {
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    background:rgba(196,90,90,0.15); color:var(--red); border:none;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:18px; transition:background .2s;
  }
  .del-btn:active { background:rgba(196,90,90,0.3); }

  /* Sticky footer actions */
  .footer-actions {
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    padding:12px 16px calc(var(--safe-bottom) + 12px);
    background:rgba(10,10,15,0.92); backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px); border-top:1px solid var(--border);
    display:flex; gap:10px;
  }
  .footer-actions .btn { margin-top:0; }

  .toast {
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text); padding:10px 18px; border-radius:24px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .3s; z-index:100;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .note {
    font-size:12px; color:var(--text3); line-height:1.5;
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:12px; margin-top:6px;
  }
  .note b { color:var(--gold-light); }
  .note code {
    background:var(--surface2); padding:2px 6px; border-radius:5px;
    font-size:11px; color:var(--teal);
  }
  .count { font-size:12px; color:var(--text3); }
</style>
</head>
<body>

<div class="header">
  <span class="brand">Gallery Admin</span>
  <a href="index.html">← View Gallery</a>
</div>

<!-- Add catalogue -->
<div class="section">
  <div class="section-title">Add Catalogue</div>
  <div class="add-box">
    <div class="field">
      <label>Catalogue name</label>
      <input id="add-name" type="text" placeholder="e.g. Summer Bridal 2025" />
    </div>
    <div class="field">
      <label>Category</label>
      <input id="add-category" type="text" list="cat-list" placeholder="e.g. Bridal" />
      <datalist id="cat-list"></datalist>
    </div>
    <div class="field">
      <label>Images folder</label>
      <label class="file-btn" for="add-folder">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>
        </svg>
        <span id="folder-label">Select image folder</span>
      </label>
      <input id="add-folder" type="file" webkitdirectory directory multiple hidden />
      <div class="file-info" id="folder-info"></div>
    </div>
    <button class="btn btn-primary" id="add-btn" onclick="addCatalogue()" disabled>Add to Gallery</button>
    <div class="note">
      <b>Important:</b> Adding here updates the gallery list only.
      You must also copy the selected folder into <code>extracted_images/</code>,
      then run <code>python make_thumbs.py</code> and re-deploy.
    </div>
  </div>
</div>

<!-- Catalogue list -->
<div class="section">
  <div class="section-title">Catalogues (<span id="cat-count">0</span>)</div>
  <div id="cat-list-container"></div>
</div>

<!-- Footer -->
<div class="footer-actions">
  <button class="btn btn-export" onclick="exportJSON()">⬇ Export gallery.json</button>
</div>

<div class="toast" id="toast"></div>

<script>
let DATA = [];
let pendingFolder = null; // { name, images: [] }

const VALID = /\.(png|jpe?g|webp|bmp)$/i;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2200);
}

function slugify(s) {
  return s.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
}

// ── Load existing data ──
fetch('gallery.json')
  .then(r => r.json())
  .then(d => { DATA = d; render(); })
  .catch(() => { DATA = []; render(); toast('Started with empty gallery'); });

// ── Folder selection ──
document.getElementById('add-folder').addEventListener('change', e => {
  const files = [...e.target.files].filter(f => VALID.test(f.name));
  if (!files.length) { toast('No images found in folder'); return; }

  // Derive folder name from the relative path
  const rel = files[0].webkitRelativePath || files[0].name;
  const folderName = rel.includes('/') ? rel.split('/')[0] : 'New Catalogue';

  const images = files
    .map(f => f.name)
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

  pendingFolder = { name: folderName, images };

  document.getElementById('folder-label').textContent = folderName;
  document.getElementById('folder-info').textContent = `${images.length} images detected`;
  if (!document.getElementById('add-name').value) {
    document.getElementById('add-name').value = folderName;
  }
  validate();
});

document.getElementById('add-name').addEventListener('input', validate);

function validate() {
  const name = document.getElementById('add-name').value.trim();
  document.getElementById('add-btn').disabled = !(name && pendingFolder);
}

// ── Add catalogue ──
function addCatalogue() {
  const name = document.getElementById('add-name').value.trim();
  const category = document.getElementById('add-category').value.trim() || 'Other';
  if (!pendingFolder) return;

  const folderName = pendingFolder.name;
  const id = slugify(folderName);

  if (DATA.some(c => c.id === id)) {
    toast('A catalogue with this folder already exists');
    return;
  }

  DATA.unshift({
    id,
    name: folderName,        // must match the folder name in extracted_images/
    pdf: `${name}.pdf`,
    category,
    imageCount: pendingFolder.images.length,
    images: pendingFolder.images
  });

  // reset
  pendingFolder = null;
  document.getElementById('add-name').value = '';
  document.getElementById('add-category').value = '';
  document.getElementById('folder-label').textContent = 'Select image folder';
  document.getElementById('folder-info').textContent = '';
  document.getElementById('add-folder').value = '';
  validate();
  render();
  toast(`Added "${name}". Remember to copy the folder + run make_thumbs.py`);
}

// ── Remove catalogue ──
function removeCatalogue(id) {
  const c = DATA.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`Remove "${c.name}" from the gallery?`)) return;
  DATA = DATA.filter(x => x.id !== id);
  render();
  toast('Removed');
}

// ── Edit category inline ──
function editCategory(id, value) {
  const c = DATA.find(x => x.id === id);
  if (c) c.category = value.trim() || 'Other';
}

// ── Render ──
function render() {
  document.getElementById('cat-count').textContent = DATA.length;

  // categories datalist
  const cats = [...new Set(DATA.map(c => c.category))].sort();
  document.getElementById('cat-list').innerHTML = cats.map(c => `<option value="${c}">`).join('');

  const container = document.getElementById('cat-list-container');
  if (!DATA.length) {
    container.innerHTML = '<div class="note">No catalogues yet. Add one above.</div>';
    return;
  }

  container.innerHTML = DATA.map(c => `
    <div class="cat-row">
      <div class="cat-row-main">
        <div class="cat-row-name">${escapeHtml(c.name)}</div>
        <div class="cat-row-meta">${c.imageCount} images · ${escapeHtml(c.pdf)}</div>
      </div>
      <input class="cat-row-cat" value="${escapeHtml(c.category)}"
             onchange="editCategory('${c.id}', this.value)" />
      <button class="del-btn" onclick="removeCatalogue('${c.id}')">×</button>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

// ── Export ──
function exportJSON() {
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gallery.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Downloaded gallery.json — replace the old file and re-deploy');
}
</script>
</body>
</html>
